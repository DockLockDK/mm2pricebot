<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>MM2 Каталог</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<header>
  <button id="back-btn" aria-label="Назад">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M15 5l-7 7 7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
  <h1 id="header-title">MM2 Каталог</h1>
</header>

<main>
  <section id="screen-home" class="screen active">
    <div id="game-update-info" class="game-update"></div>
    <div id="mm2-news" class="mm2-news"></div>

    <div class="tool-row">
      <button class="tool-btn" id="open-inventory-btn">
        <span class="tool-icon">📦</span>
        <span class="tool-label">Мой инвентарь</span>
      </button>
      <button class="tool-btn" id="open-trade-btn">
        <span class="tool-icon">⚖️</span>
        <span class="tool-label">Калькулятор трейда</span>
      </button>
    </div>

    <h2 class="section-title"><span>Категории</span></h2>
    <div id="categories" class="cat-row"><div class="loading">Загрузка…</div></div>

    <h2 class="section-title"><span>Сильно изменились в цене</span></h2>
    <div id="home-win-row" class="win-row"></div>
    <div id="movers" class="grid"></div>
  </section>

  <section id="screen-category" class="screen">
    <div class="search-row">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="#8b8f9a" stroke-width="1.8"/><path d="M21 21l-4.3-4.3" stroke="#8b8f9a" stroke-width="1.8" stroke-linecap="round"/></svg>
      <input type="text" id="category-search" class="search-input" placeholder="Поиск по названию…">
    </div>
    <select id="category-sort" class="sort-select">
      <option value="price_desc">Цена: сначала дороже</option>
      <option value="price_asc">Цена: сначала дешевле</option>
      <option value="change_desc">Изменение: сначала рост</option>
      <option value="change_asc">Изменение: сначала падение</option>
    </select>
    <div class="filter-row">
      <div class="filter-chips" id="category-change-filter">
        <button class="filter-chip all active" data-filter="all">Все</button>
        <button class="filter-chip up" data-filter="up"><svg width="9" height="9" viewBox="0 0 24 24" fill="none"><path d="M12 20V4M12 4l-6 6M12 4l6 6" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg> Выросли</button>
        <button class="filter-chip down" data-filter="down"><svg width="9" height="9" viewBox="0 0 24 24" fill="none"><path d="M12 4v16M12 20l-6-6M12 20l6-6" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg> Упали</button>
      </div>
      <div class="threshold-box" id="category-threshold-box" style="display:none;">
        от <input type="number" id="category-threshold" class="threshold-input" value="10" min="0" step="1">%
      </div>
    </div>
    <div id="category-win-row" class="win-row"></div>
    <div id="category-grid" class="grid"><div class="loading">Загрузка…</div></div>
  </section>

  <section id="screen-item" class="screen">
    <div class="hero-wrap"><img id="item-image" src="" alt="" /></div>
    <div id="item-name"></div>
    <div id="item-sub"></div>
    <div class="price-row">
      <div id="item-price" class="num"></div>
      <div id="item-prev" class="num"></div>
    </div>
    <div class="change-center"><div id="item-change"></div></div>
    <div id="item-hist-badge" class="hist-badge" style="display:none;"></div>
    <div id="item-win-row" class="win-row"></div>

    <div class="inv-stepper" id="item-inv-stepper">
      <span class="inv-stepper-label">В инвентаре:</span>
      <button id="item-inv-minus" class="inv-stepper-btn">−</button>
      <span id="item-inv-qty" class="num">0</span>
      <button id="item-inv-plus" class="inv-stepper-btn">+</button>
    </div>

    <div id="deal-note" class="deal-note" style="display:none;">
      <div class="icon"><svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M13 2L4 14h6l-1 8 9-12h-6l1-8z" fill="#ffb020"/></svg></div>
      <div id="deal-note-text"></div>
    </div>

    <div class="buy-group" id="buy-group"></div>
    <div id="funpay-note" class="funpay-note" style="display:none;">Цена с FunPay определяется по совпадению названия в объявлениях продавцов — может быть неточной.</div>

    <div class="community-values" id="community-values"></div>

    <div class="chart-block">
      <h2 class="section-title"><span>История цены</span><span class="hint" id="chart-bucket-hint"></span></h2>
      <div id="chart"></div>
    </div>

    <div class="chart-block" id="value-chart-block" style="display:none;">
      <h2 class="section-title"><span>История Community Value</span><span class="hint" id="value-chart-source"></span></h2>
      <div id="value-chart"></div>
    </div>
  </section>

  <section id="screen-inventory" class="screen">
    <div class="inv-summary">
      <div class="inv-total-label">Итого стоимость инвентаря</div>
      <div class="inv-total num" id="inventory-total">—</div>
    </div>
    <div id="inventory-list" class="slot-grid"></div>
  </section>

  <section id="screen-trade" class="screen">
    <div class="trade-cols">
      <div class="trade-col">
        <div class="trade-col-head">
          <span>Моя сторона</span>
          <span class="trade-col-total num" id="trade-a-total">0₽</span>
        </div>
        <div id="trade-list-a" class="slot-grid"></div>
      </div>
      <div class="trade-col">
        <div class="trade-col-head">
          <span>Их сторона</span>
          <span class="trade-col-total num" id="trade-b-total">0₽</span>
        </div>
        <div id="trade-list-b" class="slot-grid"></div>
      </div>
    </div>
    <div class="trade-verdict" id="trade-verdict"></div>
  </section>
</main>

<div id="picker-modal" class="picker-modal" style="display:none;">
  <div class="picker-sheet">
    <div class="picker-head">
      <div class="search-row">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="#8b8f9a" stroke-width="1.8"/><path d="M21 21l-4.3-4.3" stroke="#8b8f9a" stroke-width="1.8" stroke-linecap="round"/></svg>
        <input type="text" id="picker-search" class="search-input" placeholder="Поиск предмета… (любая редкость)">
      </div>
      <button id="picker-close" class="picker-close" aria-label="Закрыть">✕</button>
    </div>
    <div id="picker-results" class="picker-results"></div>
  </div>
</div>

<script src="/static/app.js"></script>
</body>
</html>
