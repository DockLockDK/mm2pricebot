<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>MM2 Каталог</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: var(--tg-theme-bg-color, #0f1115);
    --card: var(--tg-theme-secondary-bg-color, #1a1d24);
    --text: var(--tg-theme-text-color, #e8e8ec);
    --hint: var(--tg-theme-hint-color, #8b8f9a);
    --accent: var(--tg-theme-button-color, #4f8cff);
    --accent-text: var(--tg-theme-button-text-color, #ffffff);
    --up: #33c266;
    --down: #ef5350;
    --deal: #ffb020;
    --value: #2dd4bf;
    --godly: #f2c94c;
    --ancient: #4f8cff;
    --unique: #9b7cf5;
    --line: rgba(255,255,255,0.06);
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family: 'Manrope', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding-bottom: 24px;
  }
  .num{ font-family:'Space Grotesk', 'Manrope', sans-serif; }

  header{
    padding:18px 18px 14px; position:sticky; top:0; background:var(--bg); z-index:10;
    display:flex; align-items:center; gap:12px; border-bottom:1px solid var(--line);
  }
  header h1{ font-size:19px; font-weight:700; margin:0; flex:1; letter-spacing:-0.01em; }
  #back-btn{
    display:none; align-items:center; justify-content:center;
    width:36px; height:36px; border-radius:11px; background:var(--card); border:1px solid var(--line);
    color:var(--text); cursor:pointer; flex:none; padding:0;
  }
  #back-btn svg{ display:block; }
  main{ padding:16px 18px 12px; }
  .screen{ display:none; }
  .screen.active{ display:block; }

  h2.section-title{ display:flex; align-items:baseline; justify-content:space-between;
    font-size:12px; text-transform:uppercase; letter-spacing:.06em;
    color:#6d7280; font-weight:700; margin:0 0 10px; }
  h2.section-title .hint{ font-size:11px; color:#565a66; text-transform:none; letter-spacing:0; font-weight:600; }

  .cat-row{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:26px; }
  .cat-btn{
    display:flex; flex-direction:column; align-items:center; gap:8px;
    background:var(--card); border:1px solid var(--line); border-radius:18px; padding:14px 8px;
    color:var(--text); cursor:pointer;
  }
  .cat-btn .icon{ width:34px; height:34px; border-radius:10px; display:flex; align-items:center; justify-content:center; }
  .cat-btn .label{ font-size:13px; font-weight:700; }
  .cat-btn .count{ font-family:'Space Grotesk', sans-serif; font-size:15px; font-weight:700; }
  .cat-btn.rare-godly .icon{ background:rgba(242,201,76,0.16); }
  .cat-btn.rare-godly .label{ color:var(--godly); }
  .cat-btn.rare-ancient .icon{ background:rgba(79,140,255,0.16); }
  .cat-btn.rare-ancient .label{ color:var(--ancient); }
  .cat-btn.rare-unique .icon{ background:rgba(155,124,245,0.16); }
  .cat-btn.rare-unique .label{ color:var(--unique); }

  .grid{ display:grid; grid-template-columns: repeat(2, 1fr); gap:12px; }
  .item-card{
    background:var(--card); border:1px solid var(--line); border-radius:18px; padding:12px; cursor:pointer;
    display:flex; flex-direction:column; gap:8px;
  }
  .item-card .thumb{
    width:100%; aspect-ratio:1/1; border-radius:12px; display:flex; align-items:center; justify-content:center;
    overflow:hidden;
  }
  .item-card .thumb img{ width:78%; height:78%; object-fit:contain; }
  .item-name{ font-size:13px; font-weight:700; line-height:1.25;
    overflow:hidden; text-overflow:ellipsis; display:-webkit-box;
    -webkit-line-clamp:2; -webkit-box-orient:vertical; }
  .price-line{ display:flex; align-items:baseline; gap:6px; }
  .item-price{ font-size:16px; font-weight:700; }
  .change-row{ display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
  .item-prev{ font-size:11px; color:var(--hint); text-decoration:line-through; }
  .pill{ font-size:11px; font-weight:700; padding:2px 8px; border-radius:20px; display:inline-flex; align-items:center; gap:3px; line-height:1.5; }
  .pill.up{ color:var(--up); background:rgba(51,194,102,0.14); }
  .pill.down{ color:var(--down); background:rgba(239,83,80,0.14); }
  .pill svg{ display:block; }
  .item-deal{ font-size:11px; font-weight:700; color:var(--deal); }
  .item-values{ display:flex; align-items:center; gap:6px; font-size:10.5px; color:var(--hint);
    padding-top:6px; border-top:1px solid var(--line); }
  .item-values .dot{ width:5px; height:5px; border-radius:50%; background:var(--value); flex:none; }

  .empty{ color:var(--hint); font-size:14px; padding:20px 0; text-align:center; }

  .hero-wrap{ display:flex; justify-content:center; margin-bottom:16px; }
  #item-image{ width:176px; height:176px; object-fit:contain; border-radius:26px; display:block; }
  #item-name{ font-size:21px; font-weight:700; text-align:center; margin-bottom:8px; letter-spacing:-0.01em; }
  #item-sub{ display:flex; justify-content:center; gap:6px; margin-bottom:18px; flex-wrap:wrap; }
  .chip{ font-size:11.5px; font-weight:700; padding:4px 10px; border-radius:20px; background:rgba(255,255,255,0.05); color:var(--hint); }
  .chip.rare-godly{ color:var(--godly); background:rgba(242,201,76,0.12); }
  .chip.rare-ancient{ color:var(--ancient); background:rgba(79,140,255,0.12); }
  .chip.rare-unique{ color:var(--unique); background:rgba(155,124,245,0.12); }

  .price-row{ display:flex; justify-content:center; align-items:baseline; gap:10px; margin-bottom:8px; }
  #item-price{ font-size:30px; font-weight:800; }
  #item-prev{ font-size:14px; color:var(--hint); text-decoration:line-through; }
  .change-center{ display:flex; justify-content:center; margin-bottom:18px; }

  #chart, #value-chart{ width:100%; border-radius:18px; overflow:hidden; margin-bottom:8px; background:var(--card); border:1px solid var(--line); }
  .chart-block{ margin-bottom:20px; }
  .chart-foot{ display:flex; justify-content:space-between; font-size:10px; color:#565a66; padding:0 2px; }

  .buy-group{ display:flex; flex-direction:column; gap:10px; margin-bottom:8px; }
  .buy-btn{
    display:block; text-align:center; background:var(--accent); color:var(--accent-text);
    text-decoration:none; padding:14px; border-radius:16px; font-size:15.5px; font-weight:700;
  }
  .buy-btn.secondary{ background:var(--card); border:1px solid var(--line); color:var(--text); font-weight:600; font-size:14px; }
  .buy-btn .tag{ display:block; font-size:11px; font-weight:600; opacity:.85; margin-top:2px; }
  .deal-note{ display:flex; align-items:center; gap:10px; background:rgba(255,176,32,0.1); border:1px solid rgba(255,176,32,0.28);
    border-radius:16px; padding:12px 14px; margin-bottom:14px; font-size:12.5px; color:#ffcf6b; line-height:1.4; }
  .deal-note .icon{ width:30px; height:30px; border-radius:10px; background:rgba(255,176,32,0.18); display:flex;
    align-items:center; justify-content:center; flex:none; }
  .deal-note b{ color:var(--deal); }

  .community-values{ display:none; flex-direction:column; gap:12px; margin:0 0 20px; }
  .cv-panel{ background:var(--card); border:1px solid rgba(45,212,191,0.16); border-radius:18px; padding:14px 16px; }
  .cv-head{ display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:12px; }
  .cv-head .src{ display:flex; align-items:center; gap:6px; font-size:11.5px; font-weight:700; text-transform:uppercase;
    letter-spacing:.05em; color:var(--value); }
  .cv-head .src .dot{ width:6px; height:6px; border-radius:50%; background:var(--value); }
  .cv-head .tag{ font-size:9.5px; font-weight:700; color:#6d7280; background:rgba(255,255,255,0.05); padding:3px 8px;
    border-radius:20px; white-space:nowrap; }
  .cv-stats{ display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
  .cv-stat{ display:flex; flex-direction:column; gap:2px; }
  .cv-stat .k{ font-size:9.5px; color:#6d7280; text-transform:uppercase; letter-spacing:.04em; }
  .cv-stat .v{ font-size:14px; font-weight:700; }

  .loading{ text-align:center; color:var(--hint); padding:30px 0; }

  .win-row{ display:flex; gap:6px; overflow-x:auto; padding-bottom:2px; margin:-2px -2px 14px; scrollbar-width:none; }
  .win-row::-webkit-scrollbar{ display:none; }
  .win-chip{ flex:none; font-size:12px; font-weight:700; color:var(--hint); background:var(--card);
    border:1px solid var(--line); border-radius:20px; padding:6px 13px; cursor:pointer; white-space:nowrap; }
  .win-chip.active{ color:var(--accent-text); background:var(--accent); border-color:transparent; }

  .search-row{ position:relative; margin-bottom:10px; }
  .search-row svg{ position:absolute; left:13px; top:50%; transform:translateY(-50%); pointer-events:none; }
  .search-input{ width:100%; background:var(--card); border:1px solid var(--line); border-radius:14px;
    padding:11px 12px 11px 38px; font-size:14px; color:var(--text); font-family:inherit; }
  .search-input::placeholder{ color:var(--hint); }
  .search-input:focus{ outline:none; border-color:var(--accent); }

  .sort-select{ width:100%; background:var(--card); border:1px solid var(--line); border-radius:14px;
    padding:11px 34px 11px 14px; font-size:13.5px; font-weight:600; color:var(--text); font-family:inherit;
    margin-bottom:14px; appearance:none; -webkit-appearance:none;
    background-image:url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='24' height='24' viewBox='0 0 24 24' fill='none'%3E%3Cpath d='M6 9l6 6 6-6' stroke='%238b8f9a' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");
    background-repeat:no-repeat; background-position:right 10px center; }
  .sort-select:focus{ outline:none; border-color:var(--accent); }
</style>
</head>
<body>

<header>
  <button id="back-btn" aria-label="Назад">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M15 5l-7 7 7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
  <h1 id="header-title">MM2 Каталог</h1>
</header>

<main>
  <section id="screen-home" class="screen active">
    <h2 class="section-title"><span>Категории</span></h2>
    <div id="categories" class="cat-row"><div class="loading">Загрузка…</div></div>

    <h2 class="section-title"><span>Сильно изменились в цене</span></h2>
    <div id="home-win-row" class="win-row"></div>
    <div id="movers" class="grid"></div>
  </section>

  <section id="screen-category" class="screen">
    <div class="search-row">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="#8b8f9a" stroke-width="1.8"/><path d="M21 21l-4.3-4.3" stroke="#8b8f9a" stroke-width="1.8" stroke-linecap="round"/></svg>
      <input type="text" id="category-search" class="search-input" placeholder="Поиск по названию…">
    </div>
    <select id="category-sort" class="sort-select">
      <option value="price_desc">Цена: сначала дороже</option>
      <option value="price_asc">Цена: сначала дешевле</option>
      <option value="change_desc">Изменение: сначала рост</option>
      <option value="change_asc">Изменение: сначала падение</option>
    </select>
    <div id="category-win-row" class="win-row"></div>
    <div id="category-grid" class="grid"><div class="loading">Загрузка…</div></div>
  </section>

  <section id="screen-item" class="screen">
    <div class="hero-wrap"><img id="item-image" src="" alt="" /></div>
    <div id="item-name"></div>
    <div id="item-sub"></div>
    <div class="price-row">
      <div id="item-price" class="num"></div>
      <div id="item-prev" class="num"></div>
    </div>
    <div class="change-center"><div id="item-change"></div></div>
    <div id="item-win-row" class="win-row"></div>

    <div id="deal-note" class="deal-note" style="display:none;">
      <div class="icon"><svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M13 2L4 14h6l-1 8 9-12h-6l1-8z" fill="#ffb020"/></svg></div>
      <div id="deal-note-text"></div>
    </div>

    <div class="buy-group" id="buy-group"></div>

    <div class="community-values" id="community-values"></div>

    <div class="chart-block">
      <h2 class="section-title"><span>История цены</span><span class="hint" id="chart-bucket-hint"></span></h2>
      <div id="chart"></div>
    </div>

    <div class="chart-block" id="value-chart-block" style="display:none;">
      <h2 class="section-title"><span>История Community Value</span><span class="hint" id="value-chart-source"></span></h2>
      <div id="value-chart"></div>
    </div>
  </section>
</main>

<script>
const tg = window.Telegram && window.Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); }

const PLACEHOLDER = "data:image/svg+xml;utf8," + encodeURIComponent(
  '<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100">' +
  '<rect width="100" height="100" fill="#2a2d36"/>' +
  '<text x="50" y="55" font-size="12" fill="#666" text-anchor="middle">нет фото</text></svg>'
);

const RARE_META = {
  godly: { label: "Godly", cls: "rare-godly", tint: "rgba(242,201,76,0.16)" },
  ancient: { label: "Ancient", cls: "rare-ancient", tint: "rgba(79,140,255,0.16)" },
  unique: { label: "Unique", cls: "rare-unique", tint: "rgba(155,124,245,0.16)" },
};
function rareMeta(rare) {
  return RARE_META[(rare || "").toLowerCase()] || { label: rare || "?", cls: "", tint: "rgba(255,255,255,0.05)" };
}

const CATEGORY_ICONS = {
  godly: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none"><path d="M12 2l2.6 6.2L21 9l-5 4.6L17.4 21 12 17.3 6.6 21 8 13.6 3 9l6.4-0.8L12 2z" stroke="#f2c94c" stroke-width="1.6" stroke-linejoin="round"/></svg>',
  ancient: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none"><path d="M12 3c-3 2-6 2.5-6 2.5v6c0 4.5 3 7.5 6 8.5 3-1 6-4 6-8.5v-6S15 5 12 3z" stroke="#4f8cff" stroke-width="1.6" stroke-linejoin="round"/></svg>',
  unique: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="3.2" stroke="#9b7cf5" stroke-width="1.6"/><path d="M12 2v3.2M12 18.8V22M2 12h3.2M18.8 12H22" stroke="#9b7cf5" stroke-width="1.6" stroke-linecap="round"/></svg>',
};

const ARROW_UP = '<svg width="9" height="9" viewBox="0 0 24 24" fill="none"><path d="M12 20V4M12 4l-6 6M12 4l6 6" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const ARROW_DOWN = '<svg width="9" height="9" viewBox="0 0 24 24" fill="none"><path d="M12 4v16M12 20l-6-6M12 20l6-6" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';

// Период сравнения "было -> стало" — общий для главного экрана, категории и
// карточки предмета: сколько выбрали, столько и используется в /api/... до
// следующей смены. Список синхронизирован с WINDOW_OPTIONS в webapp/server.py.
const WINDOW_OPTIONS = [
  ["1m", "1 мин"], ["5m", "5 мин"], ["1h", "1 час"], ["3h", "3 часа"],
  ["1d", "Сутки"], ["1w", "Неделя"], ["1mo", "Месяц"], ["1q", "Квартал"], ["1y", "Год"],
];
let currentWindow = "5m";
const CHART_BUCKET_LABELS = {
  "1m": "1-мин точки", "5m": "1-мин точки", "1h": "5-мин свечи", "3h": "15-мин свечи",
  "1d": "часовые свечи", "1w": "4-часовые свечи", "1mo": "дневные свечи",
  "1q": "дневные свечи", "1y": "недельные свечи",
};

function renderWindowRow(containerSel, onChange) {
  const container = el(containerSel);
  container.innerHTML = WINDOW_OPTIONS.map(([key, label]) =>
    `<button class="win-chip${key === currentWindow ? " active" : ""}" data-win="${key}">${label}</button>`
  ).join("");
  container.querySelectorAll(".win-chip").forEach(btn => {
    btn.onclick = () => {
      const key = btn.dataset.win;
      if (key === currentWindow) return;
      currentWindow = key;
      document.querySelectorAll(".win-chip").forEach(b => b.classList.toggle("active", b.dataset.win === key));
      onChange(key);
    };
  });
}

function el(sel) { return document.querySelector(sel); }
function escapeHtml(s) {
  return (s || "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function fmtPrice(p) { return p != null ? p.toFixed(2) + "₽" : "—"; }
function changePill(change) {
  if (change == null) return "";
  const up = change > 0;
  return `<span class="pill ${up ? "up" : "down"}">${up ? ARROW_UP : ARROW_DOWN}${up ? "+" : ""}${change.toFixed(1)}%</span>`;
}

let backAction = null;
let priceChart = null;
let valueChart = null;

function showScreen(name) {
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  el("#screen-" + name).classList.add("active");
  el("#back-btn").style.display = name === "home" ? "none" : "flex";
  if (tg) {
    if (name === "home") tg.BackButton.hide();
    else { tg.BackButton.show(); }
  }
}

el("#back-btn").onclick = () => { if (backAction) backAction(); };
if (tg) tg.BackButton.onClick(() => { if (backAction) backAction(); });

function itemCard(item, onOpen) {
  const card = document.createElement("div");
  card.className = "item-card";
  const change = item.change_percent;
  const hasDeal = item.cheaper_source === "legacy" && item.legacy_price != null;
  const mainPrice = item.best_price != null ? item.best_price : item.price;
  const meta = rareMeta(item.rare);
  const shortLabel = { mm2values: "MM2V" };
  const valuesLine = (item.community_values || [])
    .map(v => `${shortLabel[v.source] || v.label}: ${v.value_raw}`)
    .join(" · ");
  card.innerHTML = `
    <div class="thumb" style="background:linear-gradient(145deg, ${meta.tint}, rgba(20,21,28,0.9));">
      <img src="${item.image}" loading="lazy" alt="">
    </div>
    <div class="item-name">${escapeHtml(item.name)}</div>
    <div class="price-line"><div class="item-price num">${fmtPrice(mainPrice)}</div></div>
    <div class="change-row">
      ${item.prev_price != null ? `<div class="item-prev num">${fmtPrice(item.prev_price)}</div>` : ""}
      ${changePill(change)}
    </div>
    ${hasDeal ? `<div class="item-deal">⚡ в обычном дороже: ${fmtPrice(item.price)}</div>` : ""}
    ${valuesLine ? `<div class="item-values"><span class="dot"></span>${escapeHtml(valuesLine)}</div>` : ""}
  `;
  card.querySelector("img").onerror = function() { this.src = PLACEHOLDER; };
  card.onclick = onOpen;
  return card;
}

async function loadHome() {
  showScreen("home");
  el("#header-title").textContent = "MM2 Каталог";
  backAction = null;

  renderWindowRow("#home-win-row", () => loadHome());

  const res = await fetch(`/api/menu?window=${currentWindow}`);
  const data = await res.json();

  const catWrap = el("#categories");
  catWrap.innerHTML = "";
  for (const c of data.categories) {
    const meta = rareMeta(c.key);
    const btn = document.createElement("button");
    btn.className = `cat-btn ${meta.cls}`;
    btn.innerHTML = `
      <div class="icon">${CATEGORY_ICONS[c.key] || ""}</div>
      <div class="label">${meta.label}</div>
      <div class="count num">${c.count}</div>
    `;
    btn.onclick = () => loadCategory(c.key);
    catWrap.appendChild(btn);
  }

  const moversWrap = el("#movers");
  moversWrap.innerHTML = "";
  if (!data.movers.length) {
    moversWrap.innerHTML = '<div class="empty">Пока нет заметных изменений цен — они появятся, как только накопится история.</div>';
  } else {
    for (const item of data.movers) {
      moversWrap.appendChild(itemCard(item, () => loadItem(item.id, loadHome)));
    }
  }
}

let categoryItems = [];
let categorySearch = "";
let categorySort = "price_desc";
let categoryKeyLoaded = null;

const SORTERS = {
  price_desc: (a, b) => (b.best_price ?? b.price ?? 0) - (a.best_price ?? a.price ?? 0),
  price_asc: (a, b) => (a.best_price ?? a.price ?? 0) - (b.best_price ?? b.price ?? 0),
  change_desc: (a, b) => (b.change_percent ?? -Infinity) - (a.change_percent ?? -Infinity),
  change_asc: (a, b) => (a.change_percent ?? Infinity) - (b.change_percent ?? Infinity),
};

function renderCategoryGrid(key) {
  const grid = el("#category-grid");
  grid.innerHTML = "";
  const query = categorySearch.trim().toLowerCase();
  const filtered = query ? categoryItems.filter(it => (it.name || "").toLowerCase().includes(query)) : categoryItems.slice();
  filtered.sort(SORTERS[categorySort] || SORTERS.price_desc);

  if (!filtered.length) {
    grid.innerHTML = `<div class="empty">${query ? "Ничего не найдено по запросу «" + escapeHtml(categorySearch) + "»." : "Нет предметов с активными лотами в этой категории."}</div>`;
    return;
  }
  for (const item of filtered) {
    grid.appendChild(itemCard(item, () => loadItem(item.id, () => loadCategory(key))));
  }
}

async function loadCategory(key) {
  showScreen("category");
  el("#header-title").textContent = key;
  backAction = loadHome;

  if (categoryKeyLoaded !== key) { categorySearch = ""; }
  categoryKeyLoaded = key;

  renderWindowRow("#category-win-row", () => loadCategory(key));

  const searchInput = el("#category-search");
  searchInput.value = categorySearch;
  searchInput.oninput = () => { categorySearch = searchInput.value; renderCategoryGrid(key); };

  const sortSelect = el("#category-sort");
  sortSelect.value = categorySort;
  sortSelect.onchange = () => { categorySort = sortSelect.value; renderCategoryGrid(key); };

  const grid = el("#category-grid");
  grid.innerHTML = '<div class="loading">Загрузка…</div>';

  const res = await fetch(`/api/category/${key}?window=${currentWindow}`);
  const data = await res.json();
  el("#header-title").textContent = data.label;
  categoryItems = data.items;
  renderCategoryGrid(key);
}

function withMinCandleBody(candles) {
  // Свечи без изменения цены (open === close) иначе рисуются нулевой высоты —
  // на глаз это невидимая тонкая полоска ("посошек"), а не прямоугольник.
  // Растягиваем тело таких свечей до минимальной заметной высоты — только
  // для отрисовки; реальная цена (текст над графиком, бейдж %) не трогается.
  let min = Infinity, max = -Infinity;
  for (const c of candles) {
    if (c.low < min) min = c.low;
    if (c.high > max) max = c.high;
  }
  const range = (max - min) || Math.abs(candles[0].open) * 0.02 || 1;
  const minBody = range * 0.035;
  return candles.map(c => {
    if (Math.abs(c.close - c.open) >= minBody) return c;
    const up = c.close >= c.open;
    const close = up ? c.open + minBody : c.open - minBody;
    return { time: c.time, open: c.open, close, high: Math.max(c.high, close), low: Math.min(c.low, close) };
  });
}

function renderPriceChart(candles) {
  const chartEl = el("#chart");
  chartEl.innerHTML = "";
  if (!candles || !candles.length || !window.LightweightCharts) {
    chartEl.innerHTML = '<div class="empty">Пока недостаточно истории для графика — она копится каждые несколько минут.</div>';
    return;
  }
  priceChart = LightweightCharts.createChart(chartEl, {
    width: chartEl.clientWidth,
    height: 220,
    layout: { background: { color: "transparent" }, textColor: "#c8c8cc", fontFamily: "'Space Grotesk','Manrope',sans-serif" },
    grid: { vertLines: { visible: false }, horzLines: { color: "rgba(255,255,255,0.06)" } },
    timeScale: { timeVisible: true, secondsVisible: false, borderVisible: false, fixLeftEdge: true, fixRightEdge: true },
    rightPriceScale: { borderVisible: false, scaleMargins: { top: 0.18, bottom: 0.12 } },
    crosshair: { vertLine: { color: "rgba(255,255,255,0.18)", labelBackgroundColor: "#242832" }, horzLine: { color: "rgba(255,255,255,0.18)", labelBackgroundColor: "#242832" } },
    localization: { priceFormatter: (p) => p.toLocaleString("ru-RU", { maximumFractionDigits: 0 }) + "₽" },
  });
  const series = priceChart.addCandlestickSeries({
    upColor: "#33c266", downColor: "#ef5350",
    borderVisible: false, wickUpColor: "#33c266", wickDownColor: "#ef5350",
    priceLineVisible: false,
    // Точную последнюю цену и так крупно показывает текст над графиком — а
    // тут после "растяжки" плоских свечей цифра была бы чуть неточной.
    lastValueVisible: false,
  });
  series.setData(withMinCandleBody(candles));
  priceChart.timeScale().fitContent();
}

function renderValueChart(history, sourceLabel) {
  const block = el("#value-chart-block");
  const chartEl = el("#value-chart");
  chartEl.innerHTML = "";
  if (!history || !history.length || !window.LightweightCharts) {
    block.style.display = "none";
    return;
  }
  block.style.display = "block";
  el("#value-chart-source").textContent = sourceLabel || "";
  valueChart = LightweightCharts.createChart(chartEl, {
    width: chartEl.clientWidth,
    height: 160,
    layout: { background: { color: "transparent" }, textColor: "#c8c8cc", fontFamily: "'Space Grotesk','Manrope',sans-serif" },
    grid: { vertLines: { visible: false }, horzLines: { color: "rgba(255,255,255,0.06)" } },
    timeScale: { timeVisible: true, secondsVisible: false, borderVisible: false, fixLeftEdge: true, fixRightEdge: true },
    rightPriceScale: { borderVisible: false, scaleMargins: { top: 0.2, bottom: 0.12 } },
    crosshair: { vertLine: { color: "rgba(45,212,191,0.35)", labelBackgroundColor: "#1c3532" }, horzLine: { color: "rgba(45,212,191,0.35)", labelBackgroundColor: "#1c3532" } },
    localization: { priceFormatter: (v) => v.toLocaleString("ru-RU", { maximumFractionDigits: 0 }) },
  });
  const series = valueChart.addAreaSeries({
    lineColor: "#2dd4bf", topColor: "rgba(45,212,191,0.28)", bottomColor: "rgba(45,212,191,0)",
    lineWidth: 2,
    priceLineVisible: false,
    lastValueVisible: history.length > 1,
  });
  series.setData(history.map(p => ({ time: p.time, value: p.value })));
  valueChart.timeScale().fitContent();
}

window.addEventListener("resize", () => {
  const chartEl = el("#chart");
  if (priceChart && chartEl) priceChart.applyOptions({ width: chartEl.clientWidth });
  const valueChartEl = el("#value-chart");
  if (valueChart && valueChartEl) valueChart.applyOptions({ width: valueChartEl.clientWidth });
});

async function loadItem(id, backFn) {
  showScreen("item");
  backAction = backFn || loadHome;
  el("#header-title").textContent = "…";

  renderWindowRow("#item-win-row", () => loadItem(id, backFn));

  const res = await fetch(`/api/item/${id}?window=${currentWindow}`);
  if (!res.ok) {
    el("#header-title").textContent = "Не найдено";
    return;
  }
  const item = await res.json();
  const meta = rareMeta(item.rare);

  el("#header-title").textContent = item.name;
  el("#item-image").src = item.image;
  el("#item-image").onerror = function() { this.src = PLACEHOLDER; };
  el("#item-name").textContent = item.name;
  el("#item-sub").innerHTML = `
    <span class="chip ${meta.cls}">${meta.label}</span>
    <span class="chip">${escapeHtml(item.category || "")}</span>
    ${item.chroma ? '<span class="chip">Chroma</span>' : ""}
  `;
  const mainPrice = item.best_price != null ? item.best_price : item.price;
  el("#item-price").textContent = fmtPrice(mainPrice);
  el("#item-prev").textContent = item.prev_price != null ? fmtPrice(item.prev_price) : "";
  el("#item-change").innerHTML = changePill(item.change_percent);

  const dealNote = el("#deal-note");
  const buyGroup = el("#buy-group");
  buyGroup.innerHTML = "";

  const hasLegacy = item.legacy_price != null;
  const legacyCheaper = item.cheaper_source === "legacy";

  if (hasLegacy && legacyCheaper) {
    dealNote.style.display = "flex";
    el("#deal-note-text").innerHTML = `<b>В обычном каталоге дороже</b> — ${fmtPrice(item.price)} там же`;
  } else {
    dealNote.style.display = "none";
  }

  // Кнопка покупки там, где дешевле — первой и выделенной; вторая ссылка — как альтернатива.
  const currentBtn = `<a class="buy-btn" href="${item.buy_url}" target="_blank" rel="noopener">Купить за ${fmtPrice(item.price)}<span class="tag">Текущий каталог</span></a>`;
  const legacyBtn = hasLegacy
    ? `<a class="buy-btn secondary" href="${item.legacy_buy_url}" target="_blank" rel="noopener">Купить за ${fmtPrice(item.legacy_price)}<span class="tag">Legacy-каталог</span></a>`
    : "";

  buyGroup.innerHTML = legacyCheaper ? (legacyBtn.replace('secondary', '') + currentBtn.replace('buy-btn', 'buy-btn secondary')) : (currentBtn + legacyBtn);

  // Community value (mm2values.com) — справочно, не цена покупки.
  const cvWrap = el("#community-values");
  const communityValues = item.community_values || [];
  if (communityValues.length) {
    cvWrap.style.display = "flex";
    cvWrap.innerHTML = communityValues.map(v => `
      <div class="cv-panel">
        <div class="cv-head">
          <a class="src" href="${v.url}" target="_blank" rel="noopener"><span class="dot"></span>Community value · ${escapeHtml(v.label)}</a>
          <span class="tag">не цена покупки</span>
        </div>
        <div class="cv-stats">
          <div class="cv-stat"><div class="k">Value</div><div class="v num">${escapeHtml(String(v.value_raw ?? "—"))}</div></div>
          <div class="cv-stat"><div class="k">Demand</div><div class="v num">${escapeHtml(String(v.demand ?? "—"))}</div></div>
          <div class="cv-stat"><div class="k">Rarity</div><div class="v num">${escapeHtml(String(v.rarity ?? "—"))}</div></div>
          <div class="cv-stat"><div class="k">Stability</div><div class="v">${escapeHtml(String(v.stability ?? "—"))}</div></div>
        </div>
      </div>
    `).join("");
  } else {
    cvWrap.style.display = "none";
    cvWrap.innerHTML = "";
  }

  el("#chart-bucket-hint").textContent = CHART_BUCKET_LABELS[item.window] || "";
  renderPriceChart(item.candles);

  const firstWithHistory = communityValues.find(v => v.history && v.history.length);
  renderValueChart(firstWithHistory ? firstWithHistory.history : null, firstWithHistory ? firstWithHistory.label : null);
}

loadHome();
</script>
