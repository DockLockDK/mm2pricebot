name: MM2 Price Tracker

on:
  schedule:
    # Каждые 5 минут (минимальный шаг у GitHub Actions; по факту иногда бывает
    # небольшая задержка на стороне GitHub, это нормально для бесплатного плана)
    - cron: "*/5 * * * *"
  workflow_dispatch: {}   # позволяет запустить вручную из вкладки Actions

# Нужно, чтобы workflow мог закоммитить обновлённые файлы истории обратно в репозиторий
permissions:
  contents: write

jobs:
  check-prices:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run price tracker
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python mm2_price_tracker.py --once

      - name: Save price history back to repo
        run: |
          git config user.name "mm2-price-bot"
          git config user.email "actions@users.noreply.github.com"
          git add history.json price_history.jsonl products_meta.json
          git diff --staged --quiet || git commit -m "Update price history [skip ci]"
          git push
